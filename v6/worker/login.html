<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ege Envanter · Hesap</title><link rel="stylesheet" href="/gate.css"><main class="welcome"><section class="gate"><div class="form"><h1>Giriş yap</h1><p class="muted">Ege Envanter panelinize erişin.</p><form><div id="person" hidden><label for="name">Ad soyad</label><input id="name" maxlength="80" autocomplete="name"></div><label for="email">E-posta adresi</label><input id="email" type="email" autocomplete="email" required><label for="pw">Şifre</label><input id="pw" type="password" autocomplete="current-password" required maxlength="256"><button class="primary">Giriş yap</button></form><div class="msg" role="status"></div></div><aside class="brand"><img src="/ege-envanter.png" alt=""><h2>Ege Envanter</h2><button id="switch">Kayıt ol</button></aside></section></main><script>
let signup=false;const el=s=>document.querySelector(s);el('#switch').onclick=()=>{signup=!signup;el('.gate').classList.toggle('register',signup);el('h1').textContent=el('.primary').textContent=signup?'Hesap oluştur':'Giriş yap';el('#switch').textContent=signup?'Giriş yap':'Kayıt ol';el('#person').hidden=!signup;el('#name').required=signup;el('#pw').minLength=signup?10:1;el('#pw').autocomplete=signup?'new-password':'current-password';el('.muted').textContent=signup?'Kişisel çalışma alanınız için en az 10 karakterli bir şifre belirleyin.':'Ege Envanter panelinize erişin.';el('.msg').textContent='';};el('form').onsubmit=async e=>{e.preventDefault();el('.primary').disabled=true;try{const r=await fetch(signup?'/api/register':'/api/login',{method:'POST',headers:{'X-Ege-Request':'1','Content-Type':'application/json'},body:JSON.stringify({name:el('#name').value,email:el('#email').value,password:el('#pw').value})});if(!r.ok)throw Error((await r.json()).error);location.replace('/');}catch(err){el('.msg').textContent=err.message||'Bağlantı kurulamadı.'}finally{el('.primary').disabled=false;}};
</script></html>
